# Render blueprint for the DNHS Inventory Management System.
# Reuses existing free Postgres dnhs-inventory-management-system-db
# (Render allows only 1 free DB). Fill DB_* in dashboard from that DB's Info tab.
# Secrets are entered in the Render dashboard, never committed to git.

services:
  - type: web
    name: dnhs-demand-forecast
    runtime: python
    rootDir: ./ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    region: singapore
    envVars:
      - key: ML_API_TOKEN
        generateValue: true

  - type: web
    name: dnhs-inventory
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: DNHS Inventory
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false # e.g. https://dnhs-inventory.onrender.com (set after first deploy)
      - key: APP_KEY
        sync: false # generate locally: php artisan key:generate --show, then paste here
        required: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # e.g. dpg-db1h2c8u01pc73edkbbg-a (Internal hostname from existing DB Info)
      - key: DB_PORT
        sync: false # e.g. 5432
      - key: DB_DATABASE
        sync: false # e.g. dnhs_inventory_management_system
      - key: DB_USERNAME
        sync: false # e.g. dianay_admin
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: MAIL_MAILER
        sync: false # e.g. smtp (set in dashboard; local stays log)
      - key: MAIL_HOST
        sync: false # e.g. smtp.gmail.com (production SMTP host)
      - key: MAIL_PORT
        sync: false # e.g. 587
      - key: MAIL_USERNAME
        sync: false # production SMTP username
      - key: MAIL_PASSWORD
        sync: false # production SMTP password (never commit)
      - key: MAIL_ENCRYPTION
        sync: false # e.g. tls
      - key: MAIL_FROM_ADDRESS
        sync: false # e.g. noreply@example.com
      - key: MAIL_FROM_NAME
        sync: false # e.g. DNHS Inventory
      - key: FORECAST_API_URL
        sync: false # Set to the dnhs-demand-forecast service URL.
      - key: FORECAST_API_TOKEN
        sync: false # Set to the same value generated for ML_API_TOKEN.
      - key: FORECAST_PYTHON_BINARY
        value: python3
      - key: FORECAST_DEMO_MODE
        value: "false"
      - key: FORECAST_MINIMUM_HISTORY
        value: "3"
      - key: FORECAST_LEAD_TIME_MONTHS
        value: "1"
      - key: FORECAST_SAFETY_STOCK_RATE
        value: "0.25"

  - type: cron
    name: dnhs-forecast-train
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    schedule: "0 2 * * *"
    startCommand: "php artisan forecast:train --no-interaction"
    envVars:
      - key: APP_NAME
        value: DNHS Inventory
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
        required: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: FORECAST_API_URL
        sync: false
      - key: FORECAST_API_TOKEN
        sync: false
      - key: FORECAST_PYTHON_BINARY
        value: python3
      - key: FORECAST_DEMO_MODE
        value: "false"
      - key: FORECAST_MINIMUM_HISTORY
        value: "3"
      - key: FORECAST_LEAD_TIME_MONTHS
        value: "1"
      - key: FORECAST_SAFETY_STOCK_RATE
        value: "0.25"
